[project]
name = "specialty-insurance-lab"
version = "0.1.0"
description = "Public SEC, macro and catastrophe data on US specialty insurers in Postgres, stress-scenario forecasts, and a d3 dashboard"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=2.1",
  "scipy>=1.14",
  "statsmodels>=0.14.4",
  "xlrd>=2.0.1",
  "pymc>=5.20",
  "arviz>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
# Supply-chain cooldown: only resolve releases that are at least 14 days old.
exclude-newer = "2026-11-03T00:00:00Z"
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
