# Python: lint and the unit tests that need no database or network.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check sil tests scripts
      - run: uv run pytest -q
      # the browser engine's parity fixture must match the Python simulator: regenerate and compare
      - run: uv run python -I scripts/make_engine_fixture.py && git diff --exit-code dashboard/tests/fixtures/engine.json
